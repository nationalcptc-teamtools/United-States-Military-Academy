<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="384" viewBox="0 0 1120 384" role="img" aria-labelledby="title desc">
<title id="title">An incremental report update preserves earlier work</title>
<desc id="desc">Version one contains F-001 with E-001 and F-002 with E-002. An update appends E-003 to F-001 after fingerprint validation. Version two preserves earlier evidence and F-002; F-001 returns to candidate review.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68849e" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="384" rx="20" fill="#0e1c2b"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="36" y="43" fill="#f5f8fc" font-size="25" font-weight="700">New evidence, one deliberate revision</text>
<text x="36" y="71" fill="#b8ccdf" font-size="15">Preserve the original. Preview the change. Return changed content to review.</text>
<rect x="36" y="101" width="300" height="210" rx="12" fill="#1b3147" stroke="#49667f"/>
<text x="56" y="132" fill="#fff" font-size="20" font-weight="600">Version 1 / kept intact</text>
<text x="56" y="172" fill="#c4d4e4" font-size="17">F-001</text><text x="140" y="172" fill="#a5cbff" font-size="17">E-001</text>
<text x="56" y="207" fill="#c4d4e4" font-size="17">F-002</text><text x="140" y="207" fill="#a5cbff" font-size="17">E-002</text>
<text x="56" y="254" fill="#a8bed2" font-size="14">Authored impact + remediation</text>
<text x="56" y="280" fill="#a8bed2" font-size="14">Source JSON + immutable exports</text>
<g stroke="#68849e" stroke-width="2" marker-end="url(#arrow)" fill="none"><path d="M346 204H390"/><path d="M718 204H762"/></g>
<rect x="400" y="101" width="308" height="210" rx="12" fill="#173a3d" stroke="#4b918a"/>
<text x="420" y="132" fill="#fff" font-size="20" font-weight="600">Curated update / preview</text>
<text x="420" y="172" fill="#8ddacb" font-size="17">Append E-003 to F-001</text>
<text x="420" y="207" fill="#c4d4e4" font-size="15">Check base SHA + import revision</text>
<text x="420" y="254" fill="#a8bed2" font-size="14">Reject stale edits and ID conflicts</text>
<text x="420" y="280" fill="#a8bed2" font-size="14">Record actor, reason and differences</text>
<rect x="772" y="101" width="312" height="210" rx="12" fill="#1b3147" stroke="#49667f"/>
<text x="792" y="132" fill="#fff" font-size="20" font-weight="600">Version 2 / new draft</text>
<text x="792" y="172" fill="#c4d4e4" font-size="17">F-001</text><text x="876" y="172" fill="#8ddacb" font-size="17">E-001 + E-003</text>
<text x="792" y="207" fill="#c4d4e4" font-size="17">F-002</text><text x="876" y="207" fill="#a5cbff" font-size="17">E-002 / unchanged</text>
<text x="792" y="254" fill="#ffd58a" font-size="14">F-001 needs renewed human review</text>
<text x="792" y="280" fill="#a8bed2" font-size="14">Evidence + authored fields retained</text>
<text x="36" y="350" fill="#a8bed2" font-size="14">Only supplied normalized summaries are used. Artifact references are never opened; hashes are not evidence verification.</text>
</g></svg>
